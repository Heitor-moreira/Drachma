
<!DOCTYPE html>
<html lang="pt-BR" class="transition-colors duration-300">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dracma — Finanças descomplicadas</title>
    <meta name="application-name" content="Dracma" />
    <meta name="theme-color" content="#2687c5" />
    <link rel="icon" type="image/svg+xml" href="/dracma-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/dracma-icon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              theme: {
                DEFAULT: '#2687c5',
                dark: '#1d6ba0'
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8fafc;
      }
      .dark body {
        background-color: #14171f;
      }

      /* Em telas grandes, mantemos a mesma área útil do iPhone 16. */
      @media (min-width: 768px) {
        body {
          background: #e2e8f0;
        }

        .dark body {
          background: #0f172a;
        }

        .phone-shell {
          width: min(100%, 390px);
          margin: 0 auto;
          box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.08), 0 20px 60px rgba(15, 23, 42, 0.16);
        }

        .phone-shell > aside {
          display: none !important;
        }

        .phone-shell > main {
          width: 100%;
          min-width: 0;
        }

        .phone-shell > main > nav {
          display: block !important;
        }
      }
      .theme-bg { background-color: #2687c5; }
      .theme-text { color: #2687c5; }
      .theme-border { border-color: #2687c5; }
      .theme-ring:focus { --tw-ring-color: #2687c5; }

      /* Efeito Luminoso de IA */
      @keyframes aura-glow {
        0%, 100% {
          box-shadow: 0 0 5px rgba(38, 135, 197, 0.2), 0 0 10px rgba(38, 135, 197, 0.1);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 15px rgba(38, 135, 197, 0.6), 0 0 30px rgba(38, 135, 197, 0.3);
          transform: scale(1.05);
        }
      }

      @keyframes initial-flash {
        0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 5px rgba(38, 135, 197, 0.4); }
        50% { opacity: 0.4; transform: scale(1.1); box-shadow: 0 0 20px rgba(38, 135, 197, 0.8); }
      }

      @keyframes hover-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }

      .ai-initial-flash {
        animation: initial-flash 0.8s infinite ease-in-out;
      }

      .ai-hover-blink:hover {
        animation: hover-blink 1s infinite ease-in-out;
        box-shadow: 0 0 15px rgba(38, 135, 197, 0.4);
      }

      .ai-active-glow {
        box-shadow: 0 0 25px rgba(38, 135, 197, 0.9) !important;
        animation: none !important;
        opacity: 1 !important;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #334155;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "xlsx": "https://esm.sh/xlsx@0.18.5",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
</head>
  <body class="transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
